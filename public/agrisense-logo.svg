<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d">
  <title id="t">AgriSense logo</title>
  <desc id="d">A leaf enclosed in a satellite scan reticle, in gold on deep forest green — sensing fields from above.</desc>

  <defs>
    <linearGradient id="leafGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7FC76B"/>
      <stop offset="0.55" stop-color="#C9A63F"/>
      <stop offset="1" stop-color="#E8CE6B"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="200" height="200"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- deep forest green canvas -->
    <rect width="200" height="200" rx="44" fill="#1C2A24"/>
  </g>

  <!-- scan reticle corners: the satellite frame -->
  <g stroke="#D9B84C" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M28 44 v-16 h16"/>
    <path d="M156 28 h16 v16"/>
    <path d="M172 156 v16 h-16"/>
    <path d="M44 172 h-16 v-16"/>
  </g>

  <!-- orbital scan diagonal (satellite link) -->
  <path d="M55 145 L145 55" stroke="#6FC78F" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.9"/>

  <!-- the leaf: agriculture at the centre of sensing -->
  <path d="M100 38 C142 66 142 127 100 162 C58 127 58 66 100 38 Z" fill="url(#leafGrad)"/>
  <!-- leaf vein -->
  <path d="M100 52 C100 88 100 124 100 150" stroke="#1C2A24" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M100 76 C84 84 76 98 74 110" stroke="#1C2A24" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M100 76 C116 84 124 98 126 110" stroke="#1C2A24" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M100 112 C88 120 82 132 80 140" stroke="#1C2A24" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M100 112 C112 120 118 132 120 140" stroke="#1C2A24" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
